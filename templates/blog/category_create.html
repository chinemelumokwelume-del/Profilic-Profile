{% extends "shared/layout.html" %}

{% block title %}
Create Post
{% endblock title %}

{% block content %}
<h1>Create Post here</h1>
<h2>Please make sure to post appropriate content at all times.</h2>
<div>
    <form method="POST" enctype="multipart/form-data" action="{% url 'blog_postcreate' %}">
        {% csrf_token %}
        <p class="mb-4">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" class="form-control border border-green-900 rounded-2xl p-3" required>
        </p>

        <p class="mb-4">
            <label for="content">Post Content</label>
            <textarea id="content" name="content" class="form-control border border-green-900 rounded-2xl p-3" required></textarea>
        </p>

        <p class="mb-4">
            <label for="image">Image</label>
            <input type="file" id="image" name="image" class="form-control border border-green-900 rounded-2xl p-3" accept="image/*">
        </p>

        <p class="mb-4">
            <label for="category">Category</label>
            <select id="category" name="category" required>
                <option value="">Select a category</option>
                {% for category in categories %}
                    <option value="{{ category.id }}">{{ category.name }}</option>
                {% endfor %}
            </select>
        </p>
        <button type="submit" class="bg-green-800 hover:bg-green-900 text-white font-bold py-2 px-4 rounded">
            Submit
        </button>
    </form>
</div>
{% endblock content %}
